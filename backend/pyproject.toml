[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "securelens-ai"
version = "1.0.0"
description = "SecureLens AI — AI-Powered Application & LLM Security Testing Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SecureLens AI contributors" }]
keywords = ["security", "sast", "appsec", "llm-security", "devsecops", "sarif"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

# Core dependencies: the scanning engines, the AI security engine, reporting and
# the CLI. Nothing here needs a database or a web server, so `pip install
# securelens-ai` is enough for CI pipelines.
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "packaging>=24.0",
  "httpx>=0.27",
  "jinja2>=3.1",
  "tree-sitter>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-php>=0.23",
]

[project.optional-dependencies]
# The API server, the worker and the database layer.
server = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
]
# Optional third-party analyzers. SecureLens runs them when they are installed
# and correlates their output with its own findings.
external = ["bandit>=1.7"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
securelens = "securelens.cli.main:main"
securelens-worker = "securelens.worker.__main__:main"
securelens-manage = "securelens.manage:main"

[tool.setuptools.packages.find]
include = ["securelens*"]

[tool.setuptools.package-data]
securelens = [
  "scanners/sast/rules/*.yml",
  "evaluation/library/*.yml",
  "findings/catalog.yml",
  "reporting/templates/*.j2",
  "core/common_passwords.txt",
  "py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:securelens.*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["tests/corpus", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = [
  "S101",   # assert is fine in tests
  "S603",   # subprocess calls are deliberate and always use argument lists
  "S607",   # external tools are resolved through shutil.which
  "B008",   # FastAPI dependency injection uses call defaults
  "RUF012",
  "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501"]
