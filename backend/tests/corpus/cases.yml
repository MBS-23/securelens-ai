# Scanner regression corpus: for every language and vulnerability category a
# vulnerable example (must be detected) and a safe example (must not be).
#
#   expect: classes that must be reported
#   min_confidence: lowest acceptable confidence for the expected classes
#   absent: classes that must NOT be reported
#
# Secrets are exercised in test_secrets.py with values generated at runtime, so
# no credential-like strings live in the repository.

# ============================================================== Python
