# SecureLens SAST rule pack — PHP (plain PHP, Laravel, Symfony, WordPress)
language: php

entry_points:
  - kind: http_route
    label: HTTP route parameter
    source_kind: http
    registrations: ["Route.get", "Route.post", "Route.put", "Route.patch", "Route.delete", "Route.any", "Route.match",
                    "$app.get", "$app.post", "$app.put", "$app.delete", "$router.get", "$router.post"]
    require_path_slash: false
    exclude_params: ["$request", "$response", "$args", "$next"]

sources:
  - id: php.http.superglobals
    kind: http
    label: HTTP request data
    match: ["$_GET", "$_POST", "$_REQUEST", "$_COOKIE", "$_FILES", "$HTTP_GET_VARS", "$HTTP_POST_VARS",
            "$_SERVER[HTTP_*]", "$_SERVER[REQUEST_URI]", "$_SERVER[QUERY_STRING]", "$_SERVER[PHP_SELF]",
            "$_SERVER[PATH_INFO]", "$_SERVER[argv]", "getallheaders()", "apache_request_headers()"]
  - id: php.http.input
    kind: http
    label: HTTP request body
    match: ["file_get_contents()", "stream_get_contents()"]
  - id: php.http.frameworks
    kind: http
    label: HTTP request data (framework)
    match: ["$request.input()", "$request.get()", "$request.query()", "$request.post()", "$request.all()",
            "$request.only()", "$request.except()", "$request.json()", "$request.cookie()", "$request.header()",
            "$request.file()", "$request.route()", "$request.string()", "$request.str()", "$request.getContent()",
            "$request.query.get()", "$request.request.get()", "$request.headers.get()", "$request.cookies.get()",
            "$request.attributes.get()", "$request.query.all()", "$request.request.all()", "request()",
            "request().input()", "Input.get()", "Request.input()", "Request.get()", "Request.query()",
            "Request.all()", "$this.request.getVar()", "$this.request.getPost()", "$this.request.getGet()",
            "$this.input.get()", "$this.input.post()", "get_query_var()", "$request.get_param()",
            "$request.get_params()", "$request.get_body()", "$request.get_json_params()"]
  - id: php.cli.input
    kind: user_input
    label: command-line input
    match: ["$argv", "$_SERVER[argv]", "fgets()", "readline()", "getopt()"]
  - id: php.llm.output
    kind: llm_output
    label: LLM completion output
    match: ["$client.chat().create()", "*.chat().create()", "*.completions().create()", "*.messages().create()",
            "OpenAI.chat().create()"]

sanitizers:
  - match: ["intval", "floatval", "boolval", "(int)", "(integer)", "(float)", "(double)", "(bool)", "(boolean)",
            "abs", "count", "is_numeric", "ctype_digit", "absint", "wp_verify_nonce", "hash_equals", "sizeof"]
    classes: ["*"]
  - match: ["filter_var", "filter_input"]
    arg_names: {1: [FILTER_VALIDATE_INT, FILTER_VALIDATE_FLOAT, FILTER_VALIDATE_BOOLEAN, FILTER_VALIDATE_BOOL,
                    FILTER_SANITIZE_NUMBER_INT, FILTER_SANITIZE_NUMBER_FLOAT, FILTER_VALIDATE_IP]}
    classes: ["*"]
  - match: ["filter_input"]
    arg_names: {2: [FILTER_VALIDATE_INT, FILTER_VALIDATE_FLOAT, FILTER_VALIDATE_BOOLEAN, FILTER_SANITIZE_NUMBER_INT]}
    classes: ["*"]
  - match: ["htmlspecialchars", "htmlentities", "strip_tags", "esc_html", "esc_attr", "esc_textarea", "esc_js",
            "e", "wp_kses", "wp_kses_post", "sanitize_text_field", "HtmlString", "Purifier.clean", "*.purify"]
    classes: [xss, llm_output_handling]
  - match: ["esc_url", "esc_url_raw", "urlencode", "rawurlencode", "http_build_query"]
    classes: [xss, open_redirect, command_injection]
  - match: ["escapeshellarg", "escapeshellcmd"]
    classes: [command_injection]
  - match: ["mysqli_real_escape_string", "mysql_real_escape_string", "mysql_escape_string", "pg_escape_string",
            "pg_escape_literal", "sqlite_escape_string", "*.real_escape_string", "*.quote", "esc_sql",
            "*.escape_string", "addslashes", "*.esc_like"]
    classes: [sql_injection]
  - match: ["basename", "sanitize_file_name", "pathinfo"]
    classes: [path_traversal, file_inclusion, unsafe_file_handling]
  - match: ["password_hash", "hash", "crypt", "sodium_crypto_pwhash_str", "Hash.make", "bcrypt"]
    classes: [plaintext_password]
  - match: ["wp_safe_redirect", "wp_validate_redirect"]
    classes: [open_redirect]

sinks:
  - id: SL-PHP-SQLI-001
    vuln_class: sql_injection
    title: SQL query built from untrusted input
    message: A SQL statement is constructed from data that is not a bound parameter
    severity: CRITICAL
    match: ["mysqli_query", "mysqli_multi_query", "mysqli_real_query", "mysqli_prepare", "mysql_query",
            "mysql_unbuffered_query", "mysql_db_query", "pg_query", "pg_send_query", "pg_prepare", "sqlite_query",
            "sqlsrv_query", "odbc_exec", "db2_exec", "oci_parse", "*.query", "*.exec", "*.prepare", "*.multi_query",
            "*.real_query", "DB.select", "DB.insert", "DB.update", "DB.delete", "DB.statement", "DB.unprepared",
            "DB.raw", "*.whereRaw", "*.orWhereRaw", "*.selectRaw", "*.orderByRaw", "*.havingRaw", "*.groupByRaw",
            "*.fromRaw", "*.get_results", "*.get_row", "*.get_var", "*.get_col", "*.createQuery",
            "*.executeQuery", "*.executeStatement", "*.createNativeQuery"]
    all_args: true
    unknown_origin: dynamic
    unknown_origin_confidence: MEDIUM
    remap: {llm_output: llm_output_handling}
  - id: SL-PHP-XSS-001
    vuln_class: xss
    title: Untrusted data written into the page
    message: Request data is echoed into the HTML response without escaping (reflected XSS)
    severity: HIGH
    match: ["echo", "print", "printf", "vprintf", "exit", "die", "print_r", "var_export", "*.write"]
    all_args: true
    derived: skip
    source_kinds: [http, llm_output]
    remap: {llm_output: llm_output_handling}
  - id: SL-PHP-CMDI-001
    vuln_class: command_injection
    title: OS command built from untrusted input
    message: A shell command is executed with data that may contain shell metacharacters
    severity: CRITICAL
    match: ["system", "exec", "shell_exec", "passthru", "popen", "proc_open", "pcntl_exec", "expect_popen",
            "mail"]
    args: [0]
    unknown_origin: nonliteral
    unknown_origin_confidence: MEDIUM
    remap: {llm_output: llm_output_handling}
  - id: SL-PHP-CODEI-001
    vuln_class: code_injection
    title: Dynamic code execution with untrusted input
    severity: CRITICAL
    match: ["eval", "assert", "create_function", "call_user_func", "call_user_func_array", "array_map", "usort",
            "array_filter", "preg_replace_callback", "register_shutdown_function"]
    args: [0]
    remap: {llm_output: llm_output_handling}
  - id: SL-PHP-LFI-001
    vuln_class: file_inclusion
    title: File inclusion path controlled by the user
    message: include/require with user-controlled input can execute arbitrary local or remote PHP code
    severity: CRITICAL
    match: ["include", "include_once", "require", "require_once"]
    args: [0]
    unknown_origin: never
  - id: SL-PHP-PATH-001
    vuln_class: path_traversal
    title: File path built from untrusted input
    message: A filesystem path is derived from user-controlled data without confinement to a base directory
    severity: HIGH
    match: ["file_get_contents", "file_put_contents", "fopen", "file", "readfile", "unlink", "copy", "rename",
            "rmdir", "mkdir", "opendir", "scandir", "glob", "parse_ini_file", "highlight_file", "show_source",
            "simplexml_load_file", "touch", "chmod", "is_file", "file_exists", "fpassthru", "gzopen",
            "Storage.get", "Storage.delete", "Storage.download", "*.download", "response().download",
            "response().file"]
    args: [0]
    source_kinds: [http, llm_output]
    remap: {llm_output: llm_output_handling}
  - id: SL-PHP-UPLOAD-001
    vuln_class: unsafe_file_handling
    title: Uploaded file moved to a user-controlled path
    message: The destination of move_uploaded_file uses the client-supplied filename, allowing traversal or uploading executable PHP
    severity: HIGH
    match: ["move_uploaded_file", "copy"]
    args: [1]
    source_kinds: [http]
  - id: SL-PHP-SSRF-001
    vuln_class: ssrf
    title: Server-side request to a URL controlled by the user
    severity: HIGH
    match: ["curl_init", "fsockopen", "pfsockopen", "get_headers", "SoapClient", "*.request", "Http.get",
            "Http.post", "wp_remote_get", "wp_remote_post", "wp_remote_request", "*.get"]
    args: [0]
    source_kinds: [http, llm_output]
    derived: skip
    remap: {llm_output: llm_output_handling}
  - id: SL-PHP-SSRF-002
    vuln_class: ssrf
    title: cURL request URL controlled by the user
    severity: HIGH
    match: ["curl_setopt"]
    args: [2]
    source_kinds: [http]
  - id: SL-PHP-DESER-001
    vuln_class: insecure_deserialization
    title: Untrusted data passed to unserialize
    message: unserialize on attacker-controlled data enables PHP object injection
    severity: CRITICAL
    match: ["unserialize", "maybe_unserialize"]
    args: [0]
    unknown_origin: nonliteral
    unknown_origin_confidence: LOW
  - id: SL-PHP-REDIRECT-001
    vuln_class: open_redirect
    title: Redirect or header value controlled by the user
    message: The Location header is built from request data
    severity: MEDIUM
    match: ["header", "wp_redirect", "redirect", "Redirect.to", "Redirect.away", "*.redirect"]
    args: [0]
    source_kinds: [http]
  - id: SL-PHP-XXE-001
    vuln_class: xxe
    title: XML parsed from untrusted input with entity loading enabled
    severity: HIGH
    match: ["simplexml_load_string", "*.loadXML", "*.loadHTML"]
    args: [0]
    source_kinds: [http]
  - id: SL-PHP-AUTH-001
    vuln_class: insecure_authentication
    title: Password stored without hashing
    severity: HIGH
    assign: ["*.password", "*.passwd", "$password_to_store"]
    source_kinds: [http]
    cwe: [CWE-256]
  - id: SL-PHP-AUTHZ-001
    vuln_class: broken_authorization
    title: Record fetched by a client-supplied identifier without an ownership check
    message: A model is loaded by an identifier from the request and the code does not reference the current user
    severity: MEDIUM
    confidence: LOW
    match: ["*.find", "*.findOrFail", "*.findOneBy", "*.where"]
    all_args: true
    source_kinds: [http]
    unless_function_mentions: ["Auth.user", "Auth.id", "auth().user", "auth().id", "$request.user",
                               "$this.authorize", "Gate.allows", "Gate.authorize", "$user", "current_user_can",
                               "get_current_user_id", "$_SESSION", "*.can", "authorize"]
  - id: SL-PHP-AI-PROMPT-001
    vuln_class: prompt_injection
    title: Untrusted input placed in LLM system instructions
    severity: HIGH
    special: role_message
    source_kinds: [http, user_input]

checks:
  - id: SL-PHP-CRYPTO-001
    kind: call
    vuln_class: weak_cryptography
    title: Weak hash algorithm (MD5/SHA-1)
    severity: MEDIUM
    confidence: HIGH
    match: ["md5", "sha1", "md5_file", "sha1_file"]
    context_regex: "(?i)pass(word|wd)?|pwd|secret"
    context_severity: HIGH
    context_cwe: [CWE-916]
    cwe: [CWE-328]
  - id: SL-PHP-CRYPTO-002
    kind: call
    vuln_class: weak_cryptography
    title: Weak hash algorithm requested by name
    severity: MEDIUM
    confidence: HIGH
    match: ["hash", "hash_hmac"]
    arg_equals: {0: [md5, sha1, md4, crc32]}
    context_regex: "(?i)pass(word|wd)?|pwd|secret"
    context_severity: HIGH
    context_cwe: [CWE-916]
    cwe: [CWE-328]
  - id: SL-PHP-CRYPTO-003
    kind: call
    vuln_class: weak_cryptography
    title: Broken cipher or ECB mode
    severity: HIGH
    confidence: HIGH
    match: ["openssl_encrypt", "openssl_decrypt"]
    arg_contains: {1: [des, rc4, rc2, ecb, bf-, blowfish]}
    cwe: [CWE-327]
  - id: SL-PHP-CRYPTO-004
    kind: call
    vuln_class: weak_cryptography
    title: Deprecated mcrypt extension
    severity: MEDIUM
    confidence: HIGH
    match: ["mcrypt_encrypt", "mcrypt_decrypt", "mcrypt_cbc", "mcrypt_ecb", "mcrypt_generic"]
    cwe: [CWE-327]
  - id: SL-PHP-RAND-001
    kind: call
    vuln_class: weak_randomness
    title: Predictable random value used for a security token
    message: rand, mt_rand, uniqid and lcg_value are predictable; use random_bytes or random_int
    severity: MEDIUM
    confidence: MEDIUM
    match: ["rand", "mt_rand", "uniqid", "lcg_value", "str_shuffle", "array_rand"]
    assigned_name_regex: "(?i)token|secret|passw|nonce|salt|otp|api_?key|session|csrf|reset|verification|code$|pin$"
    cwe: [CWE-338]
  - id: SL-PHP-TLS-001
    kind: call
    vuln_class: insecure_tls
    title: cURL certificate verification disabled
    severity: HIGH
    confidence: HIGH
    match: ["curl_setopt"]
    arg_attr: {1: ["CURLOPT_SSL_VERIFYPEER", "CURLOPT_SSL_VERIFYHOST"]}
    arg_equals: {2: ["false", "0"]}
    cwe: [CWE-295]
  - id: SL-PHP-EXTRACT-001
    kind: call
    vuln_class: dangerous_api
    title: extract() on request data
    message: extract() on request data lets clients overwrite arbitrary local variables
    severity: HIGH
    confidence: HIGH
    match: ["extract", "parse_str", "import_request_variables"]
    max_args: 1
    cwe: [CWE-621]
  - id: SL-PHP-PREG-001
    kind: call
    vuln_class: code_injection
    title: preg_replace with the /e modifier
    message: The /e modifier evaluates the replacement as PHP code
    severity: HIGH
    confidence: HIGH
    match: ["preg_replace"]
    arg_contains: {0: ["/e"]}
    cwe: [CWE-95]
  - id: SL-PHP-DEBUG-001
    kind: call
    vuln_class: dangerous_api
    title: Error details displayed to users
    severity: LOW
    confidence: MEDIUM
    match: ["ini_set"]
    arg_equals: {0: [display_errors], 1: ["1", "on", "true", "stdout"]}
    cwe: [CWE-209]
  - id: SL-PHP-INFO-001
    kind: call
    vuln_class: dangerous_api
    title: phpinfo() exposes configuration details
    severity: LOW
    confidence: HIGH
    match: ["phpinfo"]
    cwe: [CWE-200]
  - id: SL-PHP-AUTH-002
    kind: compare
    vuln_class: insecure_authentication
    title: Loose comparison of a secret or hash
    message: PHP's == juggles types, so "0e..." hashes and numeric strings compare equal; use hash_equals or ===
    severity: MEDIUM
    confidence: MEDIUM
    exploitability: LIKELY
    match: ["==", "!="]
    name_regex: "(?i)(pass(word|wd)?|pwd|hash|token|secret|signature|hmac)$"
    min_args: 0
    cwe: [CWE-697]
  - id: SL-PHP-AUTH-003
    kind: compare
    vuln_class: insecure_authentication
    title: Hardcoded credential in an authentication check
    severity: HIGH
    confidence: MEDIUM
    exploitability: LIKELY
    name_regex: "(?i)^(pass(word|wd)?|pwd|secret|api_?key|token)$"
    value_literal_min_len: 4
    cwe: [CWE-798]
  - id: SL-PHP-COOKIE-001
    kind: call
    vuln_class: insecure_authentication
    title: Session cookie configured without HttpOnly or Secure
    severity: LOW
    confidence: MEDIUM
    match: ["ini_set"]
    arg_equals: {0: [session.cookie_httponly, session.cookie_secure], 1: ["0", "false", "off"]}
    cwe: [CWE-1004]
  - id: SL-PHP-MYSQL-001
    kind: call
    vuln_class: dangerous_api
    title: Removed mysql_* extension API
    message: The mysql_* functions were removed in PHP 7 and offer no prepared statements
    severity: LOW
    confidence: HIGH
    match: ["mysql_query", "mysql_connect", "mysql_fetch_array", "mysql_fetch_assoc"]
    cwe: [CWE-477]
